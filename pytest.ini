[pytest]
asyncio_mode = auto
# tests/replay is excluded ON PURPOSE -- the default run is the
# fast inner loop, and CI's gate passes `tests` explicitly so it is still gated on
# every push. tests/adapters JOINED the default on 2026-11-11 (Chris's call): the
# brand adapters we ship are not an optional extra to test. tests/core was never a
# decision at all (docs/testing/01-overview.md): it is the
# only home of the tests for core/maintenance_component_rename_migration.py and
# core/usage_accumulator.py, it postdates this line, and nothing recorded its absence.
# Both modules consequently published as the package's WORST files (79.65% and 91.67%)
# while sitting at 100%, because scripts/update_test_docs.py inherited the same scope.
# It is 2 files / 40 tests, so adding it costs the inner loop nothing.
testpaths = tests/unit tests/integration tests/core tests/adapters
addopts =
    --cov=custom_components/eufy_vacuum
    --cov-report=term-missing
    --cov-branch
# The canonical htmlcov/ is intentionally NOT a default report: it is written ONLY
# by an explicit `--cov-report=html:htmlcov` (the deliberate regen), so an
# incidental or sub-agent coverage run can never clobber it. Default runs get the
# term-missing summary; for a disposable html report use
# `--cov-report=html:htmlcov_scratch` (gitignored).

# A test may NAME the symbol it covers; scripts/check_covers.py then proves it does.
# Written after six tests in one day passed without exercising what they named --
# four of them while closing coverage gaps. Targets are `file.py::symbol`, never a
# line number: line citations rot (21 inserted comment lines moved one guard from
# 669 to 727 the same afternoon), which is why check_doc_citations.py calls a line
# citation a defect by rule.
markers =
    covers(target): the file.py::symbol this test is asserted to cover
