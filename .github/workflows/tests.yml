name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      # The behavior gate, matching the local one: pass `tests` explicitly so the
      # adapter suite (tests/adapters, not in pytest.ini testpaths) is gated too,
      # and --no-cov so the run is the canonical pass/fail gate (coverage is
      # inspection-only; CV instrumentation under --cov is a separate artifact).
      - name: Run test suite (behavior gate)
        run: python -m pytest tests --no-cov -p no:cacheprovider --tb=short

  node:
    name: node scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # Guards scripts/process-submission.mjs (the gallery-intake bot core) — it
      # has no deps (just the theme-tags core), so no install step is needed.
      - name: Run script tests
        run: node --test scripts/process-submission.test.mjs harness/lib/gallery-html.test.mjs

  # A generated doc drifts by NOT BEING REGENERATED, and that looks exactly like
  # being correct. THEME_TOKEN_USAGE.md sat stale for four days across 31 commits to
  # src/styles/ — 651 lines out of date, every file:line citation wrong — because
  # nothing ran the generator. Unlike check_docs_index.py (a doc-commit rule by the
  # 2026-06-12 ruling), staleness here is caused by a CODE change and the fix has no
  # editorial judgement in it, so it belongs in CI. Both generators are
  # dependency-free — they import src/ directly — so neither npm ci nor pip is needed.
  generated-docs:
    name: generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check every generated doc is current
        run: python scripts/check_generated_docs.py
