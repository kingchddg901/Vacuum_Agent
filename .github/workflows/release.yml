name: release assets

# On every published GitHub release, attach:
#
#   1. eufy_vacuum.zip -- THE INSTALL PAYLOAD. hacs.json sets zip_release +
#      filename, so HACS downloads THIS ASSET rather than pulling the directory
#      contents from the tag. Two consequences, both load-bearing:
#
#        - A release published WITHOUT this asset cannot be installed. That
#          includes any release cut while this workflow is broken or skipped, and
#          it includes older releases from before the switch (backfill them or
#          accept that version-pinning users cannot select them).
#        - GitHub only meters RELEASE ASSET downloads. Pulling a directory from a
#          tag is invisible, which is why this project reported no download count
#          at all before the switch -- not zero installs, no counter.
#
#      The archive holds the CONTENTS of custom_components/eufy_vacuum/ at its
#      root (manifest.json at top level, no wrapping folder). That layout is the
#      contract; a wrapped folder installs to the wrong path for everyone. The
#      guard below asserts it before upload rather than trusting the zip command.
#
#   2. en.reference.jsonc -- the generated translator reference (full key list +
#      a per-string context note), so translators can grab it from the Releases
#      page without digging into custom_components/.../frontend/locales/.
#
# Both files are committed in-tree and current at the tagged commit.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Assert manifest.json version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # manifest.json is the ONLY version file in this project, and nothing
          # upstream forces it to agree with the tag being published. Cutting a
          # stable tag off a tree whose manifest still says -beta ships a build
          # that reports the wrong version to HACS, to diagnostics, and to every
          # issue report -- with no error anywhere. This is a content check, so
          # it runs before the zip is even built.
          #
          # Tags carry a leading v; the manifest does not.
          version=$(python3 -c "import json;print(json.load(open('custom_components/eufy_vacuum/manifest.json'))['version'])")
          expected="${TAG#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::tag $TAG expects manifest version '$expected' but manifest.json says '$version'. Refusing to build the release asset."
            exit 1
          fi
          echo "version OK -- tag $TAG matches manifest $version"

          # A pre-release version published WITHOUT the pre-release flag becomes
          # "latest" for every HACS default-store user. The check above already
          # forces manifest == tag, so this only has to police the flag.
          case "$version" in
            *-*)
              if [ "$IS_PRERELEASE" != "true" ]; then
                echo "::error::version '$version' carries a pre-release suffix but the GitHub release is not marked as a pre-release -- it would be offered to every HACS user as the latest stable. Tick 'Set as a pre-release' and re-publish."
                exit 1
              fi
              echo "pre-release flag OK -- $version published as a pre-release"
              ;;
            *)
              echo "stable version -- no pre-release suffix"
              ;;
          esac

      - name: Build eufy_vacuum.zip (contents at root, no wrapping folder)
        run: |
          cd custom_components/eufy_vacuum
          zip -r -q "$GITHUB_WORKSPACE/eufy_vacuum.zip" . \
            -x '*__pycache__*' -x '*.pyc' -x '*.pyo'

      - name: Assert the archive layout HACS requires
        run: |
          cd "$GITHUB_WORKSPACE"
          # manifest.json MUST be a root entry. If it lands as
          # eufy_vacuum/manifest.json the integration installs one directory too
          # deep and every user who updates gets a broken install -- fail here,
          # loudly, rather than shipping that.
          if ! unzip -l eufy_vacuum.zip | awk '{print $4}' | grep -qx 'manifest.json'; then
            echo "::error::manifest.json is not at the zip root -- refusing to upload."
            unzip -l eufy_vacuum.zip | head -20
            exit 1
          fi
          # A domain the manifest disagrees with would install to the wrong path.
          domain=$(python3 -c "import json,zipfile;print(json.loads(zipfile.ZipFile('eufy_vacuum.zip').read('manifest.json'))['domain'])")
          if [ "$domain" != "eufy_vacuum" ]; then
            echo "::error::manifest domain is '$domain' but the asset is named eufy_vacuum.zip."
            exit 1
          fi
          echo "layout OK -- manifest.json at root, domain=$domain"
          unzip -l eufy_vacuum.zip | tail -1

      - name: Assert bundled fonts ship with their licence
        run: |
          cd "$GITHUB_WORKSPACE"
          # The SIL Open Font License REQUIRES its notice to travel with the
          # font in every distribution. Today the zip takes everything under
          # custom_components/eufy_vacuum minus __pycache__, so OFL.txt is
          # included -- but only incidentally. A future exclusion pattern, a
          # restructure, or a fork trimming "unused" files would ship the font
          # without its licence and make the release non-compliant, silently.
          #
          # Stated as an INVARIANT rather than a file check: if any font ships,
          # the licence must ship. A release that drops the fonts entirely is a
          # feature regression, not a licensing one, and this guard correctly
          # says nothing about it.
          fonts=$(unzip -l eufy_vacuum.zip | awk '{print $4}' | grep -c '\.woff2$' || true)
          if [ "$fonts" -gt 0 ]; then
            if ! unzip -l eufy_vacuum.zip | awk '{print $4}' | grep -qx 'frontend/fonts/OFL.txt'; then
              echo "::error::$fonts font file(s) ship but frontend/fonts/OFL.txt does not -- the OFL requires the licence to travel with the font. Refusing to upload."
              unzip -l eufy_vacuum.zip | grep -i -E 'fonts/|\.woff2$' || true
              exit 1
            fi
            echo "font licensing OK -- $fonts woff2 shipped, OFL.txt present"
          else
            echo "no fonts in the archive; licence guard not applicable"
          fi

      - name: Attach the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            eufy_vacuum.zip \
            custom_components/eufy_vacuum/frontend/locales/en.reference.jsonc \
            --clobber
