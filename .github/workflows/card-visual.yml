name: card visual regression

# Frontend host-boundary gate: renders the real card headless and diffs
# against committed baselines. Runs in the SAME pinned Playwright image the
# baselines were generated in, so the comparison is byte-for-byte stable.

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "harness/**"
      # the i18n specs read the shipped packs, so a pack-only change must trigger them
      - "custom_components/eufy_vacuum/frontend/locales/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/card-visual.yml"
  pull_request:
    paths:
      - "src/**"
      - "harness/**"
      # the i18n specs read the shipped packs, so a pack-only change must trigger them
      - "custom_components/eufy_vacuum/frontend/locales/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/card-visual.yml"

jobs:
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Build harness bundle
        run: node harness/build.mjs

      # gallery-completeness runs HERE because this is the only Playwright invocation
      # in CI. Its gates -- every semantic-colour token claimed by a fixture, and
      # [FLOOR-1] every registry floor material actually rendering -- had never once
      # executed on a runner: a correct gate with no caller, which is the same shape
      # as the dead --evcc-sem-info claimant the spec's own allowlist warns about.
      # EVERY spec, not a named subset. This step used to list five of the nineteen
      # spec files, and the other fourteen -- smoke, cvd, the four i18n suites,
      # intake, real-frame, tab-gating, shape-marks and the rest -- never ran in CI
      # at all. docs/testing/frontend/render-harness.md says they run "everywhere",
      # which means NOT PLATFORM-GATED rather than "CI runs them", and that is an
      # easy sentence to read the other way.
      # It cost a real miss: smoke.spec.mjs went red at 918c6d06 when the Dashboard
      # Cards preview started returning "" without a hass, and sat red for three
      # commits until someone ran it by hand. Measured 2026-11-16: the full suite is
      # 332 passed / 32 skipped in 41s locally, so the subset bought nothing.
      - name: Frontend harness suite (all specs, incl. visual baselines)
        run: npx playwright test -c harness/playwright.config.mjs

      - name: Upload diff report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
